{% extends "base.html" %}
{% block title %}注册 · 校园失物招领{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card card-body">
      <h5 class="mb-1">注册</h5>
      <p class="meta mb-4">使用校园常用用户名注册</p>

      <form method="post" action="{{ url_for('auth.register') }}" novalidate>
        <div class="mb-3">
          <label class="form-label">用户名</label>
          <input class="form-control" type="text" name="username" minlength="3" maxlength="64">
          <div class="form-text">至少 3 个字符</div>
        </div>
        <div class="mb-3">
          <label class="form-label">真实姓名</label>
          <input class="form-control" type="text" name="real_name" maxlength="32">
        </div>
        <div class="mb-3">
          <label class="form-label">密码</label>
          <input class="form-control" type="password" name="password">
          <div class="form-text">至少 6 位</div>
        </div>
        <div class="mb-4">
          <label class="form-label">确认密码</label>
          <input class="form-control" type="password" name="password2">
        </div>
        <button class="btn btn-primary w-100" type="submit">注册</button>
      </form>

      <div class="text-center mt-3 meta">
        已有账号？<a href="{{ url_for('auth.login') }}">去登录</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
